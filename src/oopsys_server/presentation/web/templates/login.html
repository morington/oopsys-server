<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход · oopsys</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand"><span class="dot"></span> oopsys</div>
    <div class="login-sub">Мониторинг серверов и проектов</div>

    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div class="field">
        <label for="login">Логин</label>
        <input id="login" name="login" type="text" autocomplete="username" autofocus value="{{ login_value or '' }}" />
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />
      </div>
      {% if captcha_required %}
      <div class="field">
        <label for="captcha">Проверка (введите символы с картинки)</label>
        <img class="captcha-img" src="{{ captcha_data_uri }}" alt="captcha" width="200" height="70" />
        <input id="captcha" name="captcha" type="text" autocomplete="off" inputmode="text" />
        <input type="hidden" name="captcha_id" value="{{ captcha_id }}" />
      </div>
      {% endif %}
      <div class="field flex">
        <input type="checkbox" id="remember" name="remember" value="1" style="width:auto" />
        <label for="remember" style="margin:0">Запомнить меня</label>
      </div>
      <button class="btn primary" type="submit" style="width:100%">Войти</button>
    </form>
  </div>
</div>
</body>
</html>
