services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRESQL__USERNAME:-oopsys}
      POSTGRES_PASSWORD: ${POSTGRESQL__PASSWORD:-oopsys}
      POSTGRES_DB: ${POSTGRESQL__DATABASE:-oopsys}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL__USERNAME:-oopsys}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [oopsys]

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    volumes:
      - natsdata:/data
    networks: [oopsys]

  postgres-migration:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgresql.migration
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRESQL__HOST: postgres
    networks: [oopsys]
    restart: "no"

  server:
    build: .
    restart: unless-stopped
    depends_on:
      postgres-migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    env_file: .env
    environment:
      POSTGRESQL__HOST: postgres
      NATS__SERVERS: '["nats://nats:4222"]'
    networks: [oopsys]

  bot-worker:
    build: .
    command: ["bot"]
    restart: unless-stopped
    depends_on:
      postgres-migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    env_file: .env
    environment:
      POSTGRESQL__HOST: postgres
      NATS__SERVERS: '["nats://nats:4222"]'
    networks: [oopsys]

  nginx:
    build: docker/nginx
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      OOPSYS_PUBLIC_IP: ${OOPSYS_PUBLIC_IP:-}
      OOPSYS_ACME_EMAIL: ${OOPSYS_ACME_EMAIL:-}
      OOPSYS_ACME_STAGING: ${OOPSYS_ACME_STAGING:-false}
      CERTBOT_RENEW_INTERVAL_SECONDS: ${CERTBOT_RENEW_INTERVAL_SECONDS:-21600}
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks: [oopsys]

volumes:
  pgdata:
  natsdata:
  certbot_www:
  certbot_certs:

networks:
  oopsys:
    driver: bridge
