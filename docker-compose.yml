services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRESQL__USERNAME:-oopsys}
      POSTGRES_PASSWORD: ${POSTGRESQL__PASSWORD:-oopsys}
      POSTGRES_DB: ${POSTGRESQL__DATABASE:-oopsys}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL__USERNAME:-oopsys}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [oopsys]

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    volumes:
      - natsdata:/data
    networks: [oopsys]

  server:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    env_file: .env
    environment:
      POSTGRESQL__HOST: postgres
      NATS__SERVERS: '["nats://nats:4222"]'
    ports:
      - "${SERVER_PORT:-8000}:8000"
    networks: [oopsys]

  bot-worker:
    build: .
    command: ["bot"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    env_file: .env
    environment:
      POSTGRESQL__HOST: postgres
      NATS__SERVERS: '["nats://nats:4222"]'
    networks: [oopsys]

volumes:
  pgdata:
  natsdata:

networks:
  oopsys:
    driver: bridge
